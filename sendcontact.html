<div class="split-layout">
  <div class="form-side">
    <h1 class="page-title">Send a Message</h1>
    <form class="form-container contact-form" id="contactForm">
      <div class="form-group">
        <label>Your Email</label>
        <input type="email" id="contactEmail" placeholder="name@domain.com" required />
      </div>
      <div class="form-group">
        <label>Message Subject</label>
        <input type="text" id="contactSubject" placeholder="How can we help?" required />
      </div>
      <div class="form-group">
        <label>Detailed Message</label>
        <textarea id="contactMessage" rows="6" placeholder="Write your message..." required></textarea>
      </div>
      <button type="submit" class="hero-btn-span contact-form-button">Send Message</button>
    </form>
  </div>
  <div class="banner-side">
    <img src="assets/images/contact-banner.png" alt="Contact banner"
         onerror="this.onerror=null; this.src='assets/images/dark-logo.png';" />
  </div>
</div>
