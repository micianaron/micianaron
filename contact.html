<!-- Contact hero image (full‑width) -->
<div class="contact-hero">
  <img
    src="assets/images/contact-hero.png"
    alt="Contact micianaron"
    onerror="this.onerror=null; this.src='assets/images/dark-logo.png';"
  />
</div>

<!-- Ribbon under the image -->
<div class="contact-ribbon">
  <span>Get in touch with micianaron</span>
</div>

<!-- Contact content wrapper (centered) -->
<div class="contact-content">
  <div class="contact-grid">
    <div class="contact-card">
      <span class="contact-card-title">General Contact</span>
      <span class="text-block">
        For general questions, support requests, feedback, business inquiries, and other matters.
      </span>
      <a href="mailto:micianaron@gmail.com" class="contact-email">micianaron@gmail.com</a>
    </div>

    <div class="contact-card">
      <span class="contact-card-title">Social</span>
      <span class="text-block">
        Follow micianaron across our social channels for updates, new tools, announcements, and other content.
      </span>
      <div class="social-links">
        <a href="https://instagram.com/micianaron" target="_blank" rel="noopener noreferrer" class="social-item">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@micianaron" target="_blank" rel="noopener noreferrer" class="social-item">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://facebook.com/micianaron" target="_blank" rel="noopener noreferrer" class="social-item">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://x.com/micianaron" target="_blank" rel="noopener noreferrer" class="social-item">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://tiktok.com/@micianaron" target="_blank" rel="noopener noreferrer" class="social-item">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Separator between grid and the following text -->
  <span class="contact-divider"></span>

  <span class="text-block">Social handles: @micianaron</span>

  <!-- Send Email button now correctly points to the contact form page -->
  <button type="button" class="hero-btn-span contact-send-btn" data-page="sendcontact">
    Send Email
  </button>
</div>
