<div class="split-layout loading"> <!-- Added 'loading' class here -->
  <!-- Left side: registration form -->
  <div class="form-side">
    <h1 class="page-title">Partner Registration</h1>
    <form class="form-container" id="partnerRegistrationForm">
      <div class="form-group">
        <label>Business Email Address</label>
        <input id="partnerEmail" type="email" placeholder="advertiser@company.com" required />
      </div>
      <div class="form-group">
        <label>Company / Brand</label>
        <input id="partnerCompany" type="text" placeholder="Your company or brand" required />
      </div>
      <div class="form-group">
        <label>Contact Name</label>
        <input id="partnerName" type="text" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label>Account Password</label>
        <input id="partnerPassword" type="password" placeholder="Create a password" minlength="8" required />
      </div>
      <div class="form-group">
        <label>Partnership Details</label>
        <textarea id="partnerDetails" rows="4" placeholder="Tell us about your advertising or partnership request..." required></textarea>
      </div>
      <button type="submit" class="hero-btn-span">Create Partner Account</button>
    </form>
  </div>

  <!-- Right side: banner image with visible border -->
  <div class="banner-side">
    <img src="assets/images/register-banner.png" alt="Registration banner" onerror="this.onerror=null; this.src='assets/images/dark-logo.png';" />
  </div>
</div>

<!-- Initialization Script to prevent the flex/height layout glitch -->
<script>
  (function() {
    const initializeLayout = () => {
      const layout = document.querySelector(".split-layout");
      if (layout) {
        // requestAnimationFrame lets the browser compute layout dimensions first
        requestAnimationFrame(() => {
          setTimeout(() => {
            layout.classList.remove("loading");
          }, 60); // 60ms delay ensures form elements and heights completely stabilize
        });
      }
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeLayout);
    } else {
      initializeLayout();
    }
  })();
</script>
